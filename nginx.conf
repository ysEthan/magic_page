server {
    listen ${NGINX_SERVER_PORT};
    server_name ${NGINX_SERVER_NAME};

    # 前端静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API 代理
    location /api/ {
        proxy_pass ${NGINX_API_PROXY_PASS}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 配置
        add_header Access-Control-Allow-Origin ${NGINX_CORS_ALLOW_ORIGIN};
        add_header Access-Control-Allow-Methods '${NGINX_CORS_ALLOW_METHODS}';
        add_header Access-Control-Allow-Headers '${NGINX_CORS_ALLOW_HEADERS}';

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Auth API 代理
    location /auth/ {
        proxy_pass ${NGINX_API_PROXY_PASS}/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 配置
        add_header Access-Control-Allow-Origin ${NGINX_CORS_ALLOW_ORIGIN};
        add_header Access-Control-Allow-Methods '${NGINX_CORS_ALLOW_METHODS}';
        add_header Access-Control-Allow-Headers '${NGINX_CORS_ALLOW_HEADERS}';

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
} 